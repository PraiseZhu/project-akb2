[project]
name = "akb2"
version = "0.1.0"
description = "AKB2.0 工程根：lint/gate/intake CLI + MCP wrapper + tests + eval harness + engineering docs（不含知识库本体）"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "httpx>=0.24",
    "langgraph>=0.2",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/akb2/toolbox_scan"]
markers = [
    "integration: 真机集成测试（需 NLM 登录态 + gateway），默认不跑",
]
addopts = "-m 'not integration'"
