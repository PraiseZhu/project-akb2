[project]
name = "akb2"
version = "0.2.0"
description = "AKB2.0 工程根：lint/gate/intake CLI + MCP wrapper + tests + eval harness + engineering docs（不含知识库本体）"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "httpx>=0.24",
    "langgraph>=0.2",
    "openai>=1.0",
    # scrapling 的 Fetcher/StealthyFetcher(quality/intake/{discovery,extract}.py)需要
    # [fetchers] extra,它带入 curl_cffi、playwright 等。裸 scrapling 不含这些,
    # 干净环境安装会缺 curl_cffi → 运行/测试报 ModuleNotFoundError。
    "scrapling[fetchers]>=0.4.8",
    "docling>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    # 仅测试用:tests/quality/test_intake_orchestrator.py 用 feedparser 校验 feed 解析
    # 正常路径(生产代码用 xml.etree 自解析,不依赖 feedparser)。
    "feedparser>=6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/akb2/toolbox_scan"]
markers = [
    "integration: 真机集成测试（需 NLM 登录态 + gateway），默认不跑",
    "proposal_mode: 提议模式黄金样张回放测试（AKB2_AUTO_PROMOTE=0）",
    "post_amendment: 出厂正式门黄金样张回放测试（AKB2_AUTO_PROMOTE=1）",
]
addopts = "-m 'not integration'"
