# AKB2 主链路内容质量 — 校准语料库 v2
#
# 用途: 出厂验收 (SC-6.4) 与负样本回归 (SC-6.3) 的唯一数据源
# 规模: 20 条 (18 正样本按领域配比 + 2 负样本)
# 格式: 每条含 url / 领域 / expected: ingest|reject / audit(机制审计块)
#
# v2 变更 (2026-06-26, t2b-preflight-corpus):
#   - 12 条死链替换为稳定 canonical URL (replaced_reason 标注)
#   - 双层: 5 条 fixture: 引用 (黄金样张 + 概念正样本 + 无源页 + 2 负样本)
#   - per-entry feed 元数据 (feed_title/feed_author/feed_published/source_publisher/source_slug)
#   - crewai/aider/MCP 保持 live (B3-6) + 真实 feed_* + off_corpus_rationale
#   - fixture_only_domains: [] (无全 fixture 领域; 所有 9 领域均有 ≥1 live 正样本)
#   - live 正样本 aligned_count=6 (addy-osmani×4 + lilian-weng×1 + simon-willison×1), 满足 SC-7 ≥2 真实命中
#
# WP-0 审计块变更 (2026-06-30, quality-repair-v3):
#   - 每条加 audit 块: {mechanism_present, reject_reason?, original_expected,
#     mechanism_present_reason, evidence_anchors_or_url_lines, review_status, reviewers}
#   - mechanism_present=false → expected: reject + reject_reason: no_mechanism
#   - 双审不一致 → review_status: needs_adjudication, 不移 reject (保持 expected: ingest)
#
# 重标前/后分母迁移表 (WP-0):
#   重标前: 18 正样本 / 2 负样本 (factory_acceptance 分母)
#   重标后: 18 mechanism_present=true 正样本 / 2 负样本(no_mechanism)
#   迁移: 无正样本因 mechanism_present=false 移入 reject (当前 corpus 经 v2 策展，
#         无 openai 政策散文类无机制正样本); 2 条负样本补标 mechanism_present=false,
#         reject_reason=no_mechanism (原本就以 plagiarism/news 拒, 现统一归因 no_mechanism)
#   idx11 orchestration-tax: 双审 rev-b 读原文确认 mechanism_present=true (agent producers +
#         human review 瓶颈 + queue/context-switching + 非瓶颈吞吐边) → review_status=confirmed,
#         入 mp_true 分母 (原 needs_adjudication 已裁定)
#
# 领域配比 (18 正样本, 替换后守恒):
#   AI Agent: 4
#   Loop Engineering: 3
#   Context Engineering: 2
#   Harness Engineering: 2
#   Multi-Agent Orchestration: 2
#   AI Coding Workflow: 2
#   Design System & Tokens: 1
#   Knowledge Engineering: 1
#   Protocol Design: 1

# fixture_only_domains allowlist (B3-5): 允许全 fixture 的领域
# 空: 所有 9 领域均有 ≥1 live 正样本, 无领域需豁免
