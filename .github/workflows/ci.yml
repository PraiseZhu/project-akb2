name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    # 存量约 344 个 lint 问题。先非阻断:只报告、不挡合并。
    # 清零后删掉下面这行 continue-on-error 即变硬闸。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    # 暂非阻断:测试套件当前在干净 CI 环境无法全绿——
    #   1) 缺外部依赖:defuddle(npm CLI)、curl_cffi(scrapling 底层)
    #   2) 部分测试依赖本机环境:wall-clock/时区(backstop 12:00 deadline)、SIGTERM 信号语义
    # 先报告不挡合并;待套件改造成 CI 可移植后,删掉 continue-on-error 变硬闸。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
