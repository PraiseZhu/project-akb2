name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    # 存量约 344 个 lint 问题。先设非阻断:只报告、不挡合并。
    # 待 `ruff check src tests` 清零后,删掉下面这行 continue-on-error 即变成硬闸。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # pyproject 已配 addopts = -m 'not integration',默认不跑真机集成测试。
      - run: pytest
      # 若首次运行因 proposal_mode / post_amendment 黄金样张回放需要联网而失败,
      # 改用下面这行,收窄到纯单元测试:
      # - run: pytest -m "not integration and not proposal_mode and not post_amendment"
