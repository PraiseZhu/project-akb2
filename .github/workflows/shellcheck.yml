name: Shellcheck

on:
  push:
    paths: ["**/*.sh"]
  pull_request:
    paths: ["**/*.sh"]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest          # ubuntu-latest 预装 shellcheck,无需额外安装
    steps:
      - uses: actions/checkout@v4
      # 只对 error 级问题阻断(本地未预验过这 18 个脚本,先不被 style/info/warning 拦)。
      # 想收紧时把 --severity=error 去掉,即对 warning 也报错。
      - run: shellcheck --severity=error scripts/*.sh
