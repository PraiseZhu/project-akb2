name: zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/workflows/zizmor.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/workflows/zizmor.yml"

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 钉 v0.6.2 = 3dc1ecc9bcb9e94e9b2c709687979e1298497054
      # Free 私有仓无 GHAS，关 advanced-security，改用 annotations；High 即红。
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b
        with:
          advanced-security: "false"
          annotations: "true"
          min-severity: high
          persona: regular
          online-audits: "false"
          version: "1.21.0"
          inputs: ".github/workflows .github/dependabot.yml"
