    should_load: true
    pending_human_install: false
    expected_schedule:
      kind: keepalive
    expected_env_keys:
      - AKB2_AMENDMENT_APPLIED
      - AKB2_AUTO_PROMOTE
      - AKB2_MAKER_FALLBACK
      - AKB2_VAULT_ROOT
      - PATH
      - PYTHONPATH
  - label: com.akb2.briefing
