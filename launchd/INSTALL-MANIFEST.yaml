    installer: scripts/bootstrap_launchd.sh
    should_load: true
    pending_human_install: false
    expected_schedule:
      kind: calendar
      entries:
        - Hour: 7
          Minute: 30
    expected_env_keys:
      - PATH
      - PYTHONPATH
    ignore_installed_env_keys:
