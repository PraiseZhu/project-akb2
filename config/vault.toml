# ─────────────────────────────────────────────────────────────────
# AKB2 工程项目 ↔ Obsidian vault 运行时契约
# ─────────────────────────────────────────────────────────────────
# 所有读写 vault 的脚本必须通过本配置定位路径，禁止硬编码。
# Vault 内只放数据/账本/标准文档；执行源（.py/.sh）只能在本工程。

[vault]
# Obsidian vault 内 AKB2.0 子库根
akb2_root = "${HOME}/Obsidian/Praise Space/AKB2.0"

[vault.layers]
# 三层 + 支撑区，路径相对 vault.akb2_root
schema_docs = "${vault.akb2_root}/docs"
wiki        = "${vault.akb2_root}/wiki"
raw         = "${vault.akb2_root}/raw"
staging     = "${vault.akb2_root}/staging"
manifests   = "${vault.akb2_root}/manifests"
# toolbox 元数据卡（4 件套 × 5 工具），不放执行源
toolbox     = "${vault.akb2_root}/toolbox"

[vault.governance]
constitution           = "${vault.akb2_root}/AKB-2.0-CONTENT-STANDARD.md"
# 强制：禁止把 .py/.sh 写进 vault（包括 .akb-runtime/）
allow_runtime_in_vault = false

[toolbox]
# 唯一权威工具源（规则 1）
# 所有工具变更必须先在这里修改，再通过 sync 脚本分发
toolbox_root = "toolbox"  # 相对 Project AKB2 根

[install_targets]
# Project AKB2/toolbox/cc-{slug}/ → 这些目标位置
# 由 scripts/sync-skills-to-codex.sh 维护
codex_skills_root = "${HOME}/.codex/skills"
# MCP install target（cc-akb-search 专用），由 scripts/sync-mcp-server.sh 维护
mcp_install_target = "${HOME}/AI-Agent/Codex/plugins/claude-code-ai-infra/mcp-servers"

[backup_mirror]
# 仅 workspace 备份用途，不保证被 Claude Code loader 读取
# 由 scripts/sync-skills-to-claude-backup.sh 维护
claude_code_skills = "${HOME}/AI-Agent/Claude/capabilities/source/skills"
# 注意：不写 ${HOME}/.claude/skills（该目录禁写，见 v4 plan 约束）
