# 当前实际只有 L0(公共时间线)一个数据源。
# L0'/L3/L4 曾是空壳 collector(读 fixture 或返回空),已删除以消除"多源抓取"假象。
sources:
  l0:
    enabled: true
    description: "Public timeline — AI/LLM keywords"
    query: "AI OR LLM OR AGI lang:en -is:retweet"
    max_results: 20
    rate_limit:
      requests_per_15min: 10
    output_path: "/tmp/l0-out.json"
