# 循环 1 修复适配卡 v1 — 内容质量循环 (Loop A)
#
# 按 schema/repair-adapter-card.schema.json 9 字段填写。
# 修复 agent 的唯一行动契约 — 字段缺失即放开红线。
# 循环 1 与循环 7 独立，互不引用。

# ---------------------------------------------------------------------------
# 1. failure_signatures — 故障签名表 (7 项)
# ---------------------------------------------------------------------------
failure_signatures:
  - error_class: "fetch_fail"
    tier: "B"
    description: "抓取失败: defuddle/Scrapling/Docling 三级全失败，源不可达或反爬拦截。"
  - error_class: "anchor_mismatch"
    tier: "B"
    description: "raw 锚点 assert 未命中: 原文结构变化导致锚点注入失败，需更新锚点定义或切换解析器。"
  - error_class: "admission_error"
    tier: "S"
    description: "准入判定异常: LLM 路由不可用或 schema 校验失败导致准入判定无法完成，退避重试。"
  - error_class: "distill_no_converge"
    tier: "B"
    description: "提炼不收敛: 重试 3 轮后 jsonschema 校验仍失败，需调整抽取 prompt 或修复锚点引用。"
  - error_class: "grader_all_down"
    tier: "S"
    description: "评分器双不可用: GPT-5.4 和 gemini-flash 均不可达，稿件挂起等待恢复。"
  - error_class: "promote_integrity_fail"
    tier: "R"
    description: "升格完整性失败: 收尾动作中 lint 复验非 0，已自动回滚快照。需人工修复 lint 问题后重试。"
  - error_class: "quarantine_overflow"
    tier: "S"
    description: "隔离区溢出: 单源单日产量超过中位数 3 倍，该批进隔离区待人工审核。"

# ---------------------------------------------------------------------------
# 2. diagnosis_hints — 诊断线索映射
# ---------------------------------------------------------------------------
diagnosis_hints:
  fetch_fail: "检查源 URL 可达性 (curl -I); 检查 defuddle/Scrapling 版本; 查看 ~/logs/akb2-quality/fetch-errors.log 最近 50 行; 确认反爬模式命中 (anti_bot_patterns)。"
  anchor_mismatch: "对比 raw 文件 §A-§Z 锚点与 raw_archiver.ANCHOR_DEFINITIONS; 检查原文 HTML 结构是否变更; 查看 raw_archiver 日志中的 assert 失败行号。"
  admission_error: "检查 LLM 网关健康 (curl http://127.0.0.1:4000/health); 确认 gemini-flash API key 环境变量; 查看 admission.py 日志中 _validate_and_normalize 失败记录。"
  distill_no_converge: "查看 failures.jsonl 中 loop1/repair_loop/distill_no_converge 签名累计次数; 检查 ExtractResult.error 字段; 确认 deepseek-v4-pro reasoning_effort=max 透传 (litellm bug #27439)。"
  grader_all_down: "检查 GPT-5.4 和 gemini-flash 端点健康; 查看 grader.py 日志中 suspended 标记; 确认 openai 包版本 >= 1.0。"
  promote_integrity_fail: "查看 snapshots/<snapshot_id>/rollback-manifest.json; 检查 lint 输出中的 P0/P1 findings; 确认 vault 文件未被外部进程修改。"
  quarantine_overflow: "检查 discovery.py 中 QUARANTINE_MULTIPLIER 配置; 查看 sources-ledger 中该源最近 7 天产量趋势; 确认是否为机器人批量发布。"

# ---------------------------------------------------------------------------
# 3. s_whitelist — S 档白名单 (退避重试/重排队/死链标记/兜底切换)
# ---------------------------------------------------------------------------
s_whitelist:
  - "退避重试: 指数退避 (1s, 2s, 4s) 最多 3 次，重试间隔用具名常量 RETRY_BACKOFF_SEC"
  - "重排队: 将 fetch_fail 的 URL 重新入队到 raw 目录，标记 retry_count"
  - "死链标记: 连续 3 次 fetch_fail 的源标记 dead，写入 sources-ledger status=dead"
  - "兜底切换: grader_all_down 时稿件挂起，心跳恢复后自动从挂起点继续"
  - "缓存清理: 清理 staging/candidate 中超过 7 天未 promote 的候选文件"

# ---------------------------------------------------------------------------
# 4. b_editable — B 档可碰路径 (intake 解析器/重试参数)
# ---------------------------------------------------------------------------
b_editable:
  - "src/akb2/quality/intake/extract.py: 抽取决策树参数 (MIN_CONTENT_LENGTH, REQUIRED_METADATA_FIELDS, ANTI_BOT_PATTERNS)"
  - "src/akb2/quality/intake/raw_archiver.py: 锚点定义 (ANCHOR_DEFINITIONS, REQUIRED_ANCHORS)"
  - "src/akb2/quality/intake/discovery.py: 发现层参数 (QUARANTINE_MULTIPLIER, MAX_FEED_ENTRIES, FEED_TIMEOUT_SEC)"
  - "src/akb2/quality/checks_structural.py: A 层检查阈值 (MAX_GATE_REASON_CHARS, MAX_MAINTENANCE_RECORDS)"
  - "src/akb2/quality/grader.py: 评分器参数 (MAX_GRADER_RETRIES, GRADER_TIMEOUT_S)"
  - "src/akb2/quality/repair.py: 修复循环参数 (MAX_REPAIR_ROUNDS, REPAIR_TIMEOUT_S)"
  - "src/akb2/quality/runner.py: 调度参数 (POLL_INTERVAL_SECONDS, AVOID_WINDOWS)"

# ---------------------------------------------------------------------------
# 5. r_redlines — R 档红线 (gate 规则/量规语义/升格逻辑/准入判定题)
# ---------------------------------------------------------------------------
r_redlines:
  - "gate 规则: 10 项硬检查判定逻辑 (src/akb2/gate/akb2_gate_check.py)，任何修改必须经提案制人批"
  - "量规语义: 10 维量规文本 (skillpack/quality/rubric/10-dimensions.md)，版本号变更必须经提案制人批"
  - "升格逻辑: 五闸判定顺序与 fallback 规则 (src/akb2/quality/promote.py evaluate_five_gates)，修改必须经提案制人批"
  - "准入判定题: 三硬判定阈值与 taxonomy 锚点 (src/akb2/quality/admission.py _DEFAULT_DOMAIN_TAXONOMY)，新增/删除锚点必须经提案制人批"
  - "AKB2_AUTO_PROMOTE 开关: 默认 0 (fail-closed)，改为 1 必须经提案制人批 + vault 修宪完成"
  - "宪法 P1-P8 原则: 任何违反 docs/constitution.md 8 条原则的修改必须经提案制人批"

# ---------------------------------------------------------------------------
# 6. verify — 验证方法 (重跑该篇/语料子集回放)
# ---------------------------------------------------------------------------
verify:
  commands:
    - "cd /Users/praise/AI-Agent/Claude/projects/Project\\ AKB2 && python3 -m pytest tests/quality/ -q -m 'not integration'"
    - "cd /Users/praise/AI-Agent/Claude/projects/Project\\ AKB2 && python3 -m akb2.quality.calibration --corpus evals/main-pipeline-quality/corpus.yaml --report-out reports/calibration/verify.json"
    - "cd /Users/praise/AI-Agent/Claude/projects/Project\\ AKB2 && python3 -c \"import json;r=json.load(open('reports/calibration/verify.json'));assert r['positive_pass_rate']>=0.9;assert r['negative_reject_rate']==1.0;print('VERIFY PASS')\""
  timeout_sec: 600

# ---------------------------------------------------------------------------
# 7. rollback — 回滚方法 (配置版本回退)
# ---------------------------------------------------------------------------
rollback:
  commands:
    - "cd /Users/praise/AI-Agent/Claude/projects/Project\\ AKB2 && git diff --name-only HEAD~1 -- src/akb2/quality/ | xargs -r git checkout HEAD~1 --"
    - "cd /Users/praise/AI-Agent/Claude/projects/Project\\ AKB2 && python3 -m pytest tests/quality/ -q -m 'not integration'"
  description: "回滚最近一次 git commit 中 quality/ 目录的改动，并运行测试验证。如改动涉及 config/ 或 schema/ 则需额外手动处理。"

# ---------------------------------------------------------------------------
# 8. watchdog_config — watchdog 配置行 (队列心跳≤1h/失败率≤5%)
# ---------------------------------------------------------------------------
watchdog_config:
  heartbeat_path: "staging/quality-heartbeat.json"
  ledger_path: "staging/quality-ledger.jsonl"
  max_heartbeat_age_sec: 3600
  max_ledger_age_sec: 7200

# ---------------------------------------------------------------------------
# 9. shared_deps — 共享依赖 (LLM 网关/vault fs/账本目录)
# ---------------------------------------------------------------------------
shared_deps:
  - name: "deepseek-api"
    kind: "api"
    critical: true
  - name: "gpt5-checker"
    kind: "api"
    critical: true
  - name: "gemini-fallback"
    kind: "api"
    critical: false
  - name: "vault-filesystem"
    kind: "directory"
    critical: true
  - name: "staging-dir"
    kind: "directory"
    critical: true
  - name: "sources-ledger"
    kind: "file"
    critical: false